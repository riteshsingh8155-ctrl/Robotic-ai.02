<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Signal Dashboard</title>
<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center; }
select, button { padding:12px 20px; font-size:16px; margin:10px; background:#00ff88; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
#chart { width:95%; height:500px; margin:20px auto; }
#status { color:#00ff88; font-size:18px; }
</style>
<script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<h1>🤖 AI Signal Bot Dashboard</h1>

<select id="assetSelect">
  <option value="NSE:BANKNIFTY">BANKNIFTY</option>
  <option value="NSE:NIFTY">NIFTY</option>
  <option value="BINANCE:BTCUSDT">BTCUSDT</option>
  <option value="OANDA:XAUUSD">GOLD</option>
  <option value="OANDA:XAGUSD">SILVER</option>
  <option value="OANDA:WTICOUSD">CRUDE</option>
</select>

<button onclick="checkSignal()">🔍 Check & Send Signal</button>
<p id="status">Wait...</p>

<div id="chart"></div>

<script>
// ===== Telegram Setup =====
const TELEGRAM_TOKEN = "8534769215:AAH6WcPo6W9YURbnJmT1AIoApRsYedXgbRk"
const CHAT_ID = "8872099638"

const ASSETS = {
  "NSE:BANKNIFTY": { name: "BANKNIFTY", tv: "NSE%3ABANKNIFTY" },
  "NSE:NIFTY": { name: "NIFTY", tv: "NSE%3ANIFTY" },
  "BINANCE:BTCUSDT": { name: "BTCUSDT", tv: "BINANCE%3ABTCUSDT" },
  "OANDA:XAUUSD": { name: "GOLD", tv: "OANDA%3AXAUUSD" },
  "OANDA:XAGUSD": { name: "SILVER", tv: "OANDA%3AXAGUSD" },
  "OANDA:WTICOUSD": { name: "CRUDE", tv: "OANDA%3AWTICOUSD" }
}

// ===== Chart Load =====
function loadChart(symbol){
  new TradingView.widget({
    "width": "100%", "height": 500, "symbol": symbol, "interval": "5",
    "theme": "dark", "style": "1", "container_id": "chart",
    "studies": ["MACD@tv-basicstudies","RSI@tv-basicstudies","MASimple@tv-basicstudies","BB@tv-basicstudies"]
  });
}
document.getElementById("assetSelect").onchange = () => {
  document.getElementById("chart").innerHTML = "";
  loadChart(document.getElementById("assetSelect").value);
}
loadChart("NSE:BANKNIFTY");

// ===== Telegram भेजने का Function =====
function sendSignal(asset, signal, score, entry, sl, tp) {
  const emoji = signal === "BUY"? "🟢" : "🔴"
  const message = `${emoji} 💥 STRONG AI सिग्नल: ${asset.name}\n\nसिग्नल: ${signal}\nScore: ${score}/4\nEntry: ${entry}\nSL: ${sl}\nTarget: ${tp}\n\n📊 Chart: https://www.tradingview.com/chart/?symbol=${asset.tv}`
  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
 .then(()=> document.getElementById("status").innerText = "✅ Signal Sent to Telegram!")
}

// ===== Option 3: Score वाला Logic =====
function checkSignal(){
  document.getElementById("status").innerText = "⏳ Checking 4 Indicators..."
  const symbol = document.getElementById("assetSelect").value
  const asset = ASSETS[symbol]

  // NOTE: ये Dummy Data है। यहाँ असली API से Price, RSI, MACD लाना पड़ेगा
  const rsi = Math.random() * 100; 
  const macd = Math.random() > 0.5? 1 : -1;
  const ma = Math.random() > 0.5? 1 : -1;
  const bb = Math.random() > 0.5? 1 : -1;
  const price = (Math.random() * 1000 + 50000).toFixed(2)

  let score = 0;
  if(rsi < 30 && macd > 0 && ma > 0 && bb > 0) score = 4; // BUY
  if(rsi > 70 && macd < 0 && ma < 0 && bb < 0) score = 4; // SELL

  let signal = "WAIT";
  if(score == 4 && rsi < 30) signal = "BUY"
  if(score == 4 && rsi > 70) signal = "SELL"

  const entry = price;
  const sl = signal == "BUY"? (price*0.996).toFixed(2) : (price*1.004).toFixed(2);
  const tp = signal == "BUY"? (price*1.008).toFixed(2) : (price*0.992).toFixed(2);

  if(signal!= "WAIT"){
    sendSignal(asset, signal, score, entry, sl, tp)
  } else {
    document.getElementById("status").innerText = "❌ No Strong Signal. Score: " + score + "/4"
  }
}
</script>
</body>
</html>
// Force करके हमेशा BUY भेज दो टेस्ट के लिए
sendSignal(asset, "BUY", 4, entry, sl, tp)
