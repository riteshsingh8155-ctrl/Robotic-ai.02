<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Signal Bot Dashboard</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: Arial; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00FF7F; }
        .tradingview-widget-container { margin-top: 20px; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>
    <h1>🌸 Robotic AI Trading Dashboard 🌸</h1>
    <p>Live NIFTY 50 / BANKNIFTY Chart</p>

    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div id="tradingview_chart"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 610,
        "symbol": "NSE:NIFTY",
        "interval": "1",
        "timezone": "Asia/Kolkata",
        "theme": "dark",
        "style": "1",
        "locale": "in",
        "toolbar_bg": "#1a1a1a",
        "enable_publishing": false,
        "withdateranges": true,
        "range": "1D",
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": "tradingview_chart"
      });
      </script>
    </div>
    <!-- TradingView Widget END -->

</body>
</html>
