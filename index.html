<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Signal Dashboard</title>
<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center; }
select { padding:10px; font-size:16px; margin:10px; background:#222; color:#fff; border:1px solid #555; }
#chart { width:95%; height:500px; margin:20px auto; }
h1 { color:#00ff88; }
</style>
<!-- TradingView Widget -->
<script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<h1>🤖 AI Signal Bot Dashboard</h1>

<!-- 1. Stock Change का Option -->
<select id="assetSelect" onchange="changeChart()">
  <option value="NSE:BANKNIFTY">BANKNIFTY</option>
  <option value="NSE:NIFTY">NIFTY</option>
  <option value="BINANCE:BTCUSDT">BTCUSDT</option>
  <option value="OANDA:XAUUSD">GOLD</option>
  <option value="OANDA:XAGUSD">SILVER</option>
  <option value="OANDA:WTICOUSD">CRUDE</option>
</select>

<!-- 2. TradingView Chart -->
<div id="chart"></div>

<script>
// ===== Telegram Setup =====
const TELEGRAM_TOKEN = "8534769215:AAH6WcPo6W9YURbnJmT1AIoApRsYedXgbRk"
const CHAT_ID = "8872099638"

const ASSETS = [
  { name: "BANKNIFTY", tv: "NSE:BANKNIFTY" },
  { name: "NIFTY", tv: "NSE:NIFTY" },
  { name: "BTCUSDT", tv: "BINANCE:BTCUSDT" },
  { name: "GOLD", tv: "OANDA:XAUUSD" },
  { name: "SILVER", tv: "OANDA:XAGUSD" },
  { name: "CRUDE", tv: "OANDA:WTICOUSD" }
]

// ===== 3. Chart + 4 Indicators Load करने का Function =====
let widget;
function loadChart(symbol){
  new TradingView.widget({
    "width": "100%",
    "height": 500,
    "symbol": symbol,
    "interval": "5",
    "theme": "dark",
    "style": "1",
    "container_id": "chart",
    "studies": [
      "MACD@tv-basicstudies",
      "RSI@tv-basicstudies", 
      "MASimple@tv-basicstudies",
      "BB@tv-basicstudies"
    ]
  });
}

// Dropdown बदलने पर Chart बदलेगा
function changeChart(){
  const val = document.getElementById("assetSelect").value;
  document.getElementById("chart").innerHTML = ""; // पुराना chart हटाओ
  loadChart(val);
}

// पेज खुलते ही पहला Chart Load
loadChart("NSE:BANKNIFTY");

// ===== Telegram भेजने का Function =====
function sendSignal(asset, signal, score, status, entry, sl, tp) {
  const emoji = signal === "BUY"? "🟢" : "🔴"
  const message = `${emoji} 💥 AI सिग्नल: ${asset.name}\nसिग्नल: ${signal}\nScore: ${score}/4\nEntry: ${entry} SL: ${sl} TP: ${tp}\n📊 Chart: https://www.tradingview.com/chart/?symbol=${asset.tv}`
  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
}

// टेस्ट सिग्नल
setTimeout(()=> sendSignal(ASSETS[0],"BUY",4,"Strong",52000,51800,52400), 5000)
</script>
</body>
</html>
