<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Signal Bot Dashboard</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: Arial; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00FF7F; }
        #tradingview_chart { margin-top: 20px; }
        select { padding:10px; border-radius:5px; background:#00FF7F; border:none; font-size:16px; font-weight:bold; }
    </style>
</head>
<body>
    <h1>AI Signal Bot Dashboard</h1>
    <p>Live Chart - 1 Minute</p>

    <select id="symbol">
        <option value="NSE:NIFTY 50">NIFTY 50</option>
        <option value="NSE:BANKNIFTY">BANKNIFTY</option>
        <option value="NSE:RELIANCE">RELIANCE</option>
    </select>

    <div id="tradingview_chart" style="height:600px;"></div>

    <script>
        function loadChart(symbol) {
            new TradingView.widget({
                "symbol": symbol,
                "container_id": "tradingview_chart",
                "interval": "1",
                "theme": "dark",
                "style": "1",
                "locale": "in",
                "toolbar_bg": "#1a1a1a",
                "width": "100%",
                "height": 600,
                "hide_top_toolbar": false
            });
        }
        document.getElementById('symbol').onchange = function() {
            loadChart(this.value);
        }
        // Default NIFTY 50 khulega
        loadChart("NSE:NIFTY50");
    </script>

</body>
</html>
<select id="symbol">
    <option value="NSE:NIFTY 50">NIFTY 50</option>  <!-- ye line add karo sabse upar -->
    <option value="NSE:BANKNIFTY">BANKNIFTY</option>
    </select>
"NSE:BANKNIFTY": { name: "BANKNIFTY", tv: "NSE:BANKNIFTY" },
"NSE:NIFTY 50": { name: "NIFTY 50", tv: "NSE:NIFTY 50" },
