<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Signal Bot Dashboard</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: Arial; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00FF7F; }
        #tradingview_chart { margin-top: 20px; border-radius: 10px; overflow: hidden; }
        select { padding:12px; border-radius:5px; background:#00FF7F; border:none; font-size:16px; font-weight:bold; color:#000; }
    </style>
</head>
<body>
    <h1>AI Signal Bot Dashboard</h1>
    <p>Live TradingView Chart</p>

    <select id="symbol">
        <option value="NSE:NIFTY">NIFTY 50</option>
        <option value="NSE:BANKNIFTY">BANKNIFTY</option>
    </select>

    <div id="tradingview_chart" style="height:600px;"></div>

    <script>
        function loadChart(symbol) {
            document.getElementById('tradingview_chart').innerHTML = "";
            new TradingView.widget({
                "width": "100%",
                "height": 600,
                "symbol": symbol,
                "container_id": "tradingview_chart",
                "interval": "1",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "in",
                "toolbar_bg": "#1a1a1a",
                "hide_top_toolbar": false,
                "allow_symbol_change": true
            });
        }
        
        document.getElementById('symbol').onchange = function() {
            loadChart(this.value);
        }
        
        loadChart("NSE:NIFTY");
    </script>
</body>
</html>
