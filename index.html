<!DOCTYPE html><html><head><title>AI CLOUD BOT v3.2</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>body{background:#000;color:#fff;margin:0;font-family:sans-serif;text-align:center}
.login-box{margin-top:150px} input{padding:10px;width:200px} button{padding:10px 20px;background:#0f8;border:none;color:#000;font-weight:bold;cursor:pointer}
header{padding:10px;background:#111;display:flex;justify-content:space-around}
.card{padding:15px}.price{color:#0f8;font-size:24px}
#tvchart{height:500px;margin:10px} #sig{font-size:28px;font-weight:bold}.buy{color:#0f8}.sell{color:#f44}
.hidden{display:none}</style>
</head><body>

<div id="login" class="login-box">
<h2>🤖 Enter Passkey</h2>
<input type="password" id="pass" placeholder="Passkey डालो">
<button onclick="checkPass()">Login</button>
<p id="error" style="color:red"></p>
</div>

<div id="dashboard" class="hidden">
<h2>🤖 AI PRO DASHBOARD</h2>
<header>
<div>BTC: <span id="btc" class="price">$0</span></div>
<div>GOLD: <span id="gold" class="price">$0</span></div>
<div>SILVER: <span id="silver" class="price">$0</span></div>
</header>
<select id="tf" onchange="loadChart()"><option value="1">1m</option><option value="5">5m</option><option value="15">15m</option><option value="60">1H</option></select>
<div id="tvchart"></div>
<div class="card">
<h3>🤖 CLOUD AI SIGNAL</h3>
<div id="sig">पहले रेट लोड होने दो</div>
<button onclick="askAI()">AI से पूछो</button>
</div>
</div>

<script>
const API_KEY = "यहां_अपनी_Gemini_Key_पेस्ट_करो";
const PASSKEY = "Vivo1901"; // <--- यही तुम्हारा पासवर्ड है

function checkPass(){
let p = document.getElementById('pass').value;
if(p == PASSKEY){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadChart(); up(); setInterval(up,5000);
}else{
  document.getElementById('error').innerText = "Wrong Passkey!";
}}

function loadChart(){new TradingView.widget({container_id:"tvchart",symbol:"BINANCE:BTCUSDT",interval:document.getElementById('tf').value,theme:"dark",width:"100%"});}

async function up(){
try{
let b=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json());
document.getElementById('btc').innerText='$'+(+b.price).toFixed(2);
let m=await fetch('https://api.metals.live/v1/spot').then(r=>r.json());
document.getElementById('gold').innerText='$'+m[0].gold.toFixed(2);
document.getElementById('silver').innerText='$'+m[0].silver.toFixed(2);
}catch(e){}}

async function askAI(){
if(API_KEY=="यहां_अपनी_Gemini_Key_पेस्ट_करो"){alert("पहले Gemini API Key डालो");return;}
document.getElementById('sig').innerText="AI सोच रहा है...";
try{
let price = document.getElementById('btc').innerText;
let prompt = `Current BTC price is ${price}. Give only one word: BUY or SELL or HOLD.`;
let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
let data = await res.json();
let signal = data.candidates[0].content.parts[0].text.trim();
document.getElementById('sig').innerText = signal;
document.getElementById('sig').className = signal.toLowerCase();
}catch(e){document.getElementById('sig').innerText="Error: Key चेक करो"}}
</script></body></html>
