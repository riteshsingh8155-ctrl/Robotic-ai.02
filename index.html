<!DOCTYPE html>
<html>
<head>
<title>AI RALLY DETECTOR - PRO FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0a0a0a;color:#fff;margin:0;font-family:Arial;text-align:center}
h2{color:#0f8}
canvas{background:#111;margin:10px;border:2px solid #0f8;border-radius:10px}
#sig{font-size:28px;font-weight:bold;margin:15px;padding:20px;border-radius:10px}
.rally{background:#ff0;color:#000;animation:blink 1s infinite}
.buy{background:#0f8;color:#000}.sell{background:#f44;color:#fff}.hold{background:#555;color:#fff}
@keyframes blink{50%{opacity:0.5}}
button{padding:12px 25px;background:#0f8;border:none;color:#000;font-weight:bold;cursor:pointer;border-radius:8px;font-size:16px;margin:5px}
select{padding:10px;margin:10px;font-size:16px;border-radius:8px;background:#222;color:#fff;border:1px solid #0f8;width:90%;max-width:400px}
</style>
</head>
<body>
<h2>🚀 AI RALLY DETECTOR v7.0 - FINAL</h2>

<select id="symbol">
  <optgroup label="INDEX"><option value="NIFTY">Nifty 50</option><option value="BANKNIFTY">Bank Nifty</option></optgroup>
  <optgroup label="COMMODITY"><option value="GOLD">Gold</option><option value="SILVER">Silver</option></optgroup>
  <optgroup label="BANK"><option value="HDFCBANK">HDFC Bank</option><option value="ICIBANK">ICICI Bank</option><option value="SBIN">SBI</option></optgroup>
  <optgroup label="IT"><option value="TCS">TCS</option><option value="INFY">Infosys</option><option value="WIPRO">Wipro</option></optgroup>
  <optgroup label="AUTO"><option value="MARUTI">Maruti</option><option value="TATAMOTORS">Tata Motors</option></optgroup>
  <optgroup label="CRYPTO"><option value="BTC">Bitcoin</option></optgroup>
</select>

<canvas id="priceChart" height="200"></canvas>

<div>
<div id="sig">AI SCANNING...</div>
<button onclick="checkRally()">🔥 विस्फोट चेक करो</button>
</div>

<audio id="alertSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
const API_KEY = "P48NXOJZ54SA4TXL";
const TELEGRAM_TOKEN = "यहां_अपना_TOKEN_डालो"; // BotFather से मिला Token
const TELEGRAM_CHAT_ID = "यहां_अपना_CHAT_ID_डालो"; // @userinfobot से मिलेगा
let SYMBOL = "NIFTY";
let lastAlert = ""; // डुप्लीकेट अलर्ट रोकने के लिए

document.getElementById('symbol').onchange = (e)=> SYMBOL = e.target.value;
window.onload = ()=> { checkRally(); setInterval(checkRally, 20000); }

async function getData(symbol){
  let map = {GOLD:"XAUUSD", SILVER:"XAGUSD", BTC:"BTC"};
  let alphaSymbol = map[symbol] || symbol;
  let url = `https://www.alphavantage.co/query?function=RSI&symbol=${alphaSymbol}&interval=5min&time_period=14&series_type=close&apikey=${API_KEY}`;
  let res = await fetch(url); return await res.json();
}

async function sendTelegram(msg){
  if(lastAlert == msg) return; // एक ही मैसेज 2 बार नहीं जाएगा
  lastAlert = msg;
  let url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${msg}`;
  fetch(url);
  document.getElementById('alertSound').play(); // आवाज भी बजेगी
}

async function checkRally(){
  document.getElementById('sig').innerText = 'AI SCANNING...';
  let data = await getData(SYMBOL);
  let rsi = parseFloat(data["Technical Analysis: RSI"][Object.keys(data["Technical Analysis: RSI"])[0]]["RSI"]);

  if(rsi < 30){
    let msg = `🔥 RALLY ALERT! ${SYMBOL} BUY NOW | RSI: ${rsi.toFixed(2)}`;
    document.getElementById('sig').innerText = msg;
    document.getElementById('sig').className = 'rally';
    sendTelegram(msg);
  } else if(rsi > 70){
    let msg = `⚠️ OVERBOUGHT! ${SYMBOL} SELL | RSI: ${rsi.toFixed(2)}`;
    document.getElementById('sig').innerText = msg;
    document.getElementById('sig').className = 'sell';
    sendTelegram(msg);
  } else {
    document.getElementById('sig').innerText = `HOLD | ${SYMBOL} RSI: ${rsi.toFixed(2)}`;
    document.getElementById('sig').className = 'hold';
  }
}
</script>
</body>
</html>
