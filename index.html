<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic AI Trading Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #00ff88; font-family: Arial; }
        header { background: #111; padding: 15px; text-align: center; border-bottom: 2px solid #00ff88; }
        h1 { font-size: 1.8em; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; padding: 15px; }
        .box { background: #1a1a1a; border: 1px solid #00ff88; border-radius: 10px; padding: 10px; height: 420px; }
        .strategy { grid-column: 1 / 4; height: auto; padding: 20px; }
        .box h2 { font-size: 1.1em; margin-bottom: 10px; text-align: center; color: #00ff88; }
        iframe { width: 100%; height: 360px; border: none; border-radius: 8px; }
        .strategy h3 { color: #00ff88; margin: 10px 0; }
        .
