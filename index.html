<!DOCTYPE html><html><head><title>AI TRADING DASHBOARD</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0a0a0a;color:#fff;margin:0;font-family:Arial;text-align:center}
h2{color:#0f8} header{display:flex;justify-content:space-around;padding:15px;background:#111;flex-wrap:wrap}
.price{color:#0f8;font-size:22px;font-weight:bold}
#tvchart{height:520px;margin:10px}
.card{padding:20px} #sig{font-size:30px;font-weight:bold;margin:10px}
.buy{color:#0f8}.sell{color:#f44}.hold{color:#ff8}
button{padding:12px 25px;background:#0f8;border:none;color:#000;font-weight:bold;cursor:pointer;border-radius:8px;font-size:16px}
</style></head><body>
<h2>🤖 AI CLOUD TRADING DASHBOARD</h2>

<header>
<div>BTC: <span id="btc" class="price">$0</span></div>
<div>GOLD: <span id="gold" class="price">$0</span></div>
<div>SILVER: <span id="silver" class="price">$0</span></div>
</header>

<select id="tf" onchange="loadChart()" style="padding:8px;margin:10px">
<option value="1">1m</option><option value="5">5m</option><option value="15">15m</option><option value="60">1H</option>
</select>

<div id="tvchart"></div>

<div class="card">
<h3>CLOUD AI SIGNAL</h3>
<div id="sig">AI Ready</div>
<button onclick="askAI()">AI से पूछो</button>
</div>

<script>
const API_KEY = "यहां_अपनी_Gemini_Key_पेस्ट_करो";

function loadChart(){
  if(typeof TradingView!== "undefined"){
    new TradingView.widget({
      container_id:"tvchart", symbol:"BINANCE:BTCUSDT",
      interval:document.getElementById('tf').value, theme:"dark",
      width:"100%", height:500
    });
  }else{
    document.getElementById('tvchart').innerHTML = "TradingView लोड नहीं हुआ। नेट चेक करो और Refresh करो"
  }
}
window.onload = loadChart; // पेज लोड होते ही चार्ट

async function up(){
  try{
    let b=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json());
    document.getElementById('btc').innerText='$'+(+b.price).toFixed(2);
    let m=await fetch('https://api.metals.live/v1/spot').then(r=>r.json());
    document.getElementById('gold').innerText='$'+m[0].gold.toFixed(2);
    document.getElementById('silver').innerText='$'+m[0].silver.toFixed(2);
  }catch(e){}
}
up(); setInterval(up,5000);

async function askAI(){
  if(API_KEY=="यहां_अपनी_Gemini_Key_पेस्ट_करो"){alert("पहले API Key डालो");return;}
  document.getElementById('sig').innerText="AI सोच रहा है...";
  let price = document.getElementById('btc').innerText;
  let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:`BTC price ${price}. Give only BUY or SELL or HOLD`}] }]})
  });
  let data = await res.json();
  let signal = data.candidates[0].content.parts[0].text.trim();
  document.getElementById('sig').innerText = signal;
  document.getElementById('sig').className = signal.toLowerCase();
}
</script></body></html>
