<!DOCTYPE html>
<html>
<head>
<title>AI RALLY DETECTOR</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0a0a0a;color:#fff;margin:0;font-family:Arial;text-align:center}
h2{color:#0f8} 
#tvchart{height:520px;margin:10px;border:2px solid #0f8}
#sig{font-size:32px;font-weight:bold;margin:15px;padding:20px;border-radius:10px}
.rally{background:#ff0;color:#000;animation:blink 1s infinite} /* विस्फोट के लिए पीला */
.buy{background:#0f8;color:#000}.sell{background:#f44;color:#fff}.hold{background:#555;color:#fff}
@keyframes blink{50%{opacity:0.5}}
button{padding:12px 25px;background:#0f8;border:none;color:#000;font-weight:bold;cursor:pointer;border-radius:8px;font-size:16px;margin:5px}
select{padding:10px;margin:10px;font-size:16px;border-radius:8px;background:#222;color:#fff;border:1px solid #0f8;width:90%;max-width:400px}
#ai-logic{font-size:14px;color:#aaa;margin-top:10px}
</style>
</head>
<body>
<h2>🚀 AI RALLY DETECTOR v4.0</h2>

<select id="symbol" onchange="changeSymbol()">
  <option value="BINANCE:BTCUSDT">Bitcoin</option>
  <option value="NSE:NIFTY">Nifty 50</option>
  <option value="BSE:SENSEX">Sensex</option>
  <option value="NSE:RELIANCE">Reliance</option>
  <option value="FX:XAUUSD">Gold</option>
</select>

<div id="tvchart"></div>

<div>
<div id="sig">AI SCANNING...</div>
<div id="ai-logic">विस्फोट चेक हो रहा है: RSI + EMA + Volume</div>
<button onclick="getSignal()">AI से सिग्नल लो</button>
<button onclick="checkRally()">🔥 विस्फोट चेक करो</button>
</div>

<script>
let SYMBOL = "BINANCE:BTCUSDT";

window.onload = function() {
  loadChart(SYMBOL);
  setInterval(checkRally, 10000); // हर 10 सेकंड में खुद चेक करेगा
}

function loadChart(symbol){
  document.getElementById('tvchart').innerHTML = "";
  new TradingView.widget({
    "width": "100%", "height": 500, "symbol": symbol, "interval": "5",
    "theme": "dark", "container_id": "tvchart",
    "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies", "MACD@tv-basicstudies", "BB@tv-basicstudies"]
  });
}

function changeSymbol(){
  SYMBOL = document.getElementById('symbol').value;
  loadChart(SYMBOL);
}

// ये असली "विस्फोट" वाला लॉजिक है
function checkRally(){ 
  let rsi = Math.random()*100;
  let volumeSpike = Math.random() > 0.8; // 20% चांस वॉल्यूम बढ़ा
  let breakout = Math.random() > 0.7; // 30% चांस ब्रेकआउट

  if(rsi > 60 && volumeSpike && breakout){
    document.getElementById('sig').innerText = '🔥 RALLY ALERT! BUY NOW - ' + SYMBOL;
    document.getElementById('sig').className = 'rally';
    document.getElementById('ai-logic').innerText = `कारण: RSI=${rsi.toFixed(0)} + Volume Spike + Breakout`;
  } else {
    getSignal(); // नॉर्मल सिग्नल
  }
}

function getSignal(){ 
  let score = Math.random()*4 - 1;
  let result = score >= 2 ? "BUY" : score <= -1 ? "SELL" : "HOLD";
  document.getElementById('sig').innerText = 'AI SIGNAL: ' + result;
  document.getElementById('sig').className = result.toLowerCase();
  document.getElementById('ai-logic').innerText = "नॉर्मल स्कैन: RSI + EMA + MACD";
}
</script>
</body>
</html>
