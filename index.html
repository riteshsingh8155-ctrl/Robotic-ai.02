<!DOCTYPE html>
<html>
<head>
<title>AI RALLY DETECTOR - REAL DATA</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0a0a0a;color:#fff;margin:0;font-family:Arial;text-align:center}
h2{color:#0f8} 
#tvchart{height:480px;margin:10px;border:2px solid #0f8}
#sig{font-size:28px;font-weight:bold;margin:15px;padding:20px;border-radius:10px}
.rally{background:#ff0;color:#000;animation:blink 1s infinite}
.buy{background:#0f8;color:#000}.sell{background:#f44;color:#fff}.hold{background:#555;color:#fff}
@keyframes blink{50%{opacity:0.5}}
button{padding:12px 25px;background:#0f8;border:none;color:#000;font-weight:bold;cursor:pointer;border-radius:8px;font-size:16px;margin:5px}
select{padding:10px;margin:10px;font-size:16px;border-radius:8px;background:#222;color:#fff;border:1px solid #0f8;width:90%;max-width:400px}
#ai-logic{font-size:14px;color:#aaa;margin-top:10px}
</style>
</head>
<body>
<h2>🚀 AI RALLY DETECTOR v5.0 - LIVE</h2>

<select id="symbol" onchange="changeSymbol()">
  <option value="NSE:NIFTY">Nifty 50</option>
  <option value="BSE:SENSEX">Sensex</option>
  <option value="NSE:RELIANCE">Reliance</option>
  <option value="BINANCE:BTCUSDT">Bitcoin</option>
</select>

<div id="tvchart"></div>

<div>
<div id="sig">AI SCANNING...</div>
<div id="ai-logic">Alpha Vantage से लाइव डेटा ले रहा हूं</div>
<button onclick="checkRally()">🔥 विस्फोट चेक करो</button>
</div>

<script>
const API_KEY = "P48NXOJZ54SA4TXL"; // तुम्हारी Key
let SYMBOL = "NSE:NIFTY";

// TradingView Chart
window.onload = function() {
  loadChart(SYMBOL);
  setInterval(checkRally, 15000); // हर 15 सेकंड में चेक
}

function loadChart(symbol){
  document.getElementById('tvchart').innerHTML = "";
  new TradingView.widget({
    "width": "100%", "height": 480, "symbol": symbol, "interval": "5",
    "theme": "dark", "container_id": "tvchart",
    "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies", "MACD@tv-basicstudies"]
  });
}

function changeSymbol(){
  SYMBOL = document.getElementById('symbol').value;
  loadChart(SYMBOL);
}

// असली डेटा से "विस्फोट" चेक
async function checkRally(){ 
  document.getElementById('sig').innerText = 'AI SCANNING...';
  let stock = SYMBOL.split(":")[1]; // NIFTY निकालना
  
  let url = `https://www.alphavantage.co/query?function=RSI&symbol=${stock}&interval=5min&time_period=14&series_type=close&apikey=${API_KEY}`;
  
  try{
    let res = await fetch(url);
    let data = await res.json();
    let rsiData = data["Technical Analysis: RSI"];
    let latestTime = Object.keys(rsiData)[0];
    let rsi = parseFloat(rsiData[latestTime]["RSI"]);

    document.getElementById('ai-logic').innerText = `लाइव RSI: ${rsi.toFixed(2)} | Time: ${latestTime}`;

    if(rsi < 30){
      document.getElementById('sig').innerText = '🔥 RALLY ALERT! BUY NOW';
      document.getElementById('sig').className = 'rally';
    } else if(rsi > 70){
      document.getElementById('sig').innerText = '⚠️ OVERBOUGHT! SELL ALERT';
      document.getElementById('sig').className = 'sell';
    } else {
      document.getElementById('sig').innerText = 'HOLD - विस्फोट नहीं है';
      document.getElementById('sig').className = 'hold';
    }
  } catch(e){
    document.getElementById('sig').innerText = 'ERROR: API Limit. 1 मिनट बाद ट्राई करो';
  }
}
</script>
</body>
</html>
