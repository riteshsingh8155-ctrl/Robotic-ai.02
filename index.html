<!DOCTYPE html>
<html>
<head>
<title>AI RALLY DETECTOR</title>
<style>
body{background:#0a0a0a;color:#fff;text-align:center;font-family:Arial;padding:20px}
h2{color:#0f8}
#sig{font-size:24px;font-weight:bold;margin:15px;padding:20px;border-radius:10px}
.rally{background:#ff0;color:#000;animation:blink 1s infinite}
.hold{background:#555}.sell{background:#f44}
@keyframes blink{50%{opacity:0.5}}
button{padding:12px 25px;background:#0f8;border:none;color:#000;font-weight:bold;border-radius:8px}
select{padding:10px;margin:10px;border-radius:8px;background:#222;color:#fff;border:1px solid #0f8}
</style>
</head>
<body>
<h2>🚀 AI RALLY DETECTOR v7.3 - WORKING</h2>
<select id="symbol">
  <option value="BTCUSD">Bitcoin</option>
  <option value="XAUUSD">Gold</option>
  <option value="XAGUSD">Silver</option>
  <option value="IBM">IBM Stock</option> <!-- Alpha Vantage में NIFTY नहीं चलता, US स्टॉक से टेस्ट करो -->
</select>
<div id="sig">AI SCANNING...</div>
<button onclick="checkRally()">🔥 विस्फोट चेक करो</button>

<script>
const API_KEY = "P48NXOJZ54SA4TXL";
let SYMBOL = "BTCUSD";
document.getElementById('symbol').onchange = (e)=> SYMBOL = e.target.value;
window.onload = checkRally;

async function checkRally(){
  document.getElementById('sig').innerText = 'AI SCANNING...';
  document.getElementById('sig').className = 'hold';
  let url = `https://www.alphavantage.co/query?function=RSI&symbol=${SYMBOL}&interval=5min&time_period=14&series_type=close&apikey=${API_KEY}`;
  try{
    let res = await fetch(url);
    let data = await res.json();
    if(!data["Technical Analysis: RSI"]) throw new Error("डेटा नहीं मिला। BTCUSD ट्राई करो");
    
    let rsi = parseFloat(data["Technical Analysis: RSI"][Object.keys(data["Technical Analysis: RSI"])[0]]["RSI"]);
    document.getElementById('sig').innerText = `HOLD | ${SYMBOL} RSI: ${rsi.toFixed(2)}`;
    
    if(rsi < 30) {document.getElementById('sig').innerText = `🔥 RALLY ALERT! BUY | RSI: ${rsi.toFixed(2)}`; document.getElementById('sig').className = 'rally';}
    if(rsi > 70) {document.getElementById('sig').innerText = `⚠️ SELL ALERT! | RSI: ${rsi.toFixed(2)}`; document.getElementById('sig').className = 'sell';}
  }catch(e){
    document.getElementById('sig').innerText = `ERROR: ${e.message}`;
    document.getElementById('sig').className = 'sell';
  }
}
</script>
</body>
</html>
